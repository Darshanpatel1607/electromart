<!doctype html><html><body><h2>Content Calendar</h2>
<form id='f'><input name='content_title' placeholder='Title' required/><input name='publish_date' type='date'/><button>Add</button></form>
<pre id='out'></pre><script>
async function load(){out.textContent=JSON.stringify(await fetch('/api/content-calendar').then(r=>r.json()),null,2)}
f.onsubmit=async(e)=>{e.preventDefault();await fetch('/api/content-calendar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});load()};load();
</script></body></html>
