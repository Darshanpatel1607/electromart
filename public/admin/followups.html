<!doctype html><html><head><link rel='stylesheet' href='/styles.css'><title>Follow-Ups</title></head><body><header><h2>Follow-Up Dashboard</h2><nav><a href='/admin/dashboard.html'>Dashboard</a></nav></header><main class='card'><h3>Action Queue</h3><table id='t'><thead><tr><th>Brand</th><th>Status</th><th>Last Conversation</th><th>Priority</th></tr></thead><tbody></tbody></table></main><script>fetch('/api/follow-ups').then(r=>r.json()).then(rows=>{const tb=document.querySelector('#t tbody');tb.innerHTML='';rows.forEach(r=>tb.innerHTML+=`<tr><td>${r.brand_name||''}</td><td>${r.status||''}</td><td>${r.last_conversation_date||''}</td><td><span class='badge ${(r.follow_up_priority||'none').toLowerCase()}'>${r.follow_up_priority||'None'}</span></td></tr>`)});</script></body></html>
