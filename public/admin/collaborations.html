<!doctype html><html><head><link rel='stylesheet' href='/styles.css'><title>CRM</title></head><body><header><h2>Collaborations CRM</h2><nav><a href='/admin/dashboard.html'>Dashboard</a></nav></header><main class='grid cols-2'><section class='card'><h3>Add Lead</h3><form id='f' class='grid'><input name='brand_name' placeholder='Brand Name' required><input name='contact_person_name' placeholder='Contact Name'><input name='email_address' placeholder='Email'><input name='last_conversation_date' type='date' required><select name='status'><option>New Lead</option><option>Awaiting Response</option><option>Negotiating</option><option>Completed</option></select><button>Add Collaboration</button></form></section><section class='card'><h3>Leads</h3><pre id='out'>Loading...</pre></section></main><script>async function load(){out.textContent=JSON.stringify(await fetch('/api/collaborations').then(r=>r.json()),null,2)};f.onsubmit=async(e)=>{e.preventDefault();await fetch('/api/collaborations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});f.reset();load()};load();</script></body></html>
