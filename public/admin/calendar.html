<!doctype html><html><head><link rel='stylesheet' href='/styles.css'><title>Content Calendar</title></head><body><header><h2>Content Calendar</h2><nav><a href='/admin/dashboard.html'>Dashboard</a></nav></header><main class='grid cols-2'><section class='card'><h3>Plan Content</h3><form id='f' class='grid'><input name='content_title' placeholder='Title' required><input name='topic' placeholder='Topic'><select name='status'><option>Idea</option><option>Research</option><option>Script</option><option>Shooting</option><option>Editing</option><option>Scheduled</option><option>Published</option></select><input name='publish_date' type='date'><button>Add</button></form></section><section class='card'><h3>Schedule</h3><pre id='out'>Loading...</pre></section></main><script>async function load(){out.textContent=JSON.stringify(await fetch('/api/content-calendar').then(r=>r.json()),null,2)};f.onsubmit=async(e)=>{e.preventDefault();await fetch('/api/content-calendar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f).entries()))});f.reset();load()};load();</script></body></html>
